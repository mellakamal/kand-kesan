<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kesan Peserta | KAND Academy</title>
<meta name="description" content="Kesan peserta KAND Academy (kutipan anonim yang sudah disetujui).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b1a6b;
    --muted: #6b5a85;
    --card: rgba(255,255,255,.82);
    --accent: #6d4ab5;
    --mint: #bdf0d3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 16px 48px; color: var(--ink);
    font-family: "Josefin Sans", system-ui, sans-serif;
    background: linear-gradient(135deg, #dcd0ff 0%, #f6efff 45%, #f7c9e4 100%) fixed;
    min-height: 100vh;
  }
  main { max-width: 720px; margin: 0 auto; }
  header { text-align: center; padding: 40px 0 20px; }
  h1 { margin: 0 0 6px; font-size: 1.9rem; }
  header p { margin: 0; color: var(--muted); }
  .back { display: inline-block; margin-top: 14px; color: var(--accent); font-weight: 600; text-decoration: none; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 18px 0; }
  .chip {
    border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer;
    background: var(--card); color: var(--ink); font: inherit; font-weight: 600;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .stats { text-align: center; color: var(--muted); margin-bottom: 14px; }
  .list { display: grid; gap: 12px; }
  .card { background: var(--card); border-radius: 18px; padding: 16px 18px; box-shadow: 0 4px 14px rgba(80,40,140,.08); }
  .meta { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
  .stars { color: #e0a100; letter-spacing: 2px; }
  .quote { margin: 0; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .state { text-align: center; color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kesan Peserta</h1>
    <p>Kutipan anonim dari peserta KAND Academy yang sudah disetujui untuk ditampilkan.</p>
    <a class="back" href="https://s.id/kandacademy-jru">&larr; Kembali ke menu</a>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Filter kelas"></div>
  <div class="stats" id="stats"></div>
  <div class="list" id="list"><div class="state">Memuat…</div></div>
</main>

<script>
  // Link CSV dari tab "Kesan Publik" (File > Bagikan > Publikasikan ke web > pilih tab itu > CSV).
  // Jangan pernah memakai link dari tab jawaban mentah.
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRaUnbFMQcw3NaDNkWpOm1HUE-YY29YbkkR31U4wRvzT7Gr7HyGgpFSHVX-TAuSCnfbkX-uYxJ-Mr6n/pub?gid=1119835628&single=true&output=csv";

  const $ = (id) => document.getElementById(id);
  let rows = [];
  let activeKelas = "";

  // Parser CSV yang menangani tanda kutip dan baris baru di dalam sel.
  function parseCSV(text) {
    const out = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i+1] === "\n") i++;
        row.push(cell); cell = "";
        if (row.some((x) => x.trim() !== "")) out.push(row);
        row = [];
      } else cell += c;
    }
    row.push(cell);
    if (row.some((x) => x.trim() !== "")) out.push(row);
    return out;
  }

  function render() {
    const shown = rows.filter((r) => !activeKelas || r.kelas === activeKelas);
    $("stats").textContent = shown.length ? shown.length + " kesan ditampilkan" : "";
    const list = $("list");
    list.replaceChildren();
    if (!shown.length) {
      const d = document.createElement("div");
      d.className = "state"; d.textContent = "Belum ada kesan yang ditampilkan.";
      list.append(d); return;
    }
    for (const r of shown) {
      const card = document.createElement("article"); card.className = "card";
      const meta = document.createElement("div"); meta.className = "meta";
      const left = document.createElement("span");
      left.textContent = r.kelas + (r.sesi ? " · Sesi " + r.sesi : "");
      const stars = document.createElement("span"); stars.className = "stars";
      const n = Math.max(0, Math.min(5, parseInt(r.skor, 10) || 0));
      stars.textContent = "★".repeat(n) + "☆".repeat(5 - n);
      stars.setAttribute("aria-label", n + " dari 5");
      meta.append(left, stars);
      const p = document.createElement("p"); p.className = "quote"; p.textContent = r.kutipan;
      card.append(meta, p); list.append(card);
    }
  }

  function renderFilters() {
    const box = $("filters"); box.replaceChildren();
    const kelas = ["", ...new Set(rows.map((r) => r.kelas).filter(Boolean))];
    if (kelas.length < 3) return; // satu kelas saja: filter tidak perlu
    for (const k of kelas) {
      const b = document.createElement("button"); b.className = "chip"; b.type = "button";
      b.textContent = k || "Semua";
      b.setAttribute("aria-pressed", String(k === activeKelas));
      b.onclick = () => { activeKelas = k; renderFilters(); render(); };
      box.append(b);
    }
  }

  async function load() {
    if (!CSV_URL || CSV_URL.startsWith("GANTI_")) {
      $("list").innerHTML = '<div class="state">Link CSV belum diisi.</div>'; return;
    }
    try {
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const data = parseCSV(await res.text());
      const head = data.shift().map((h) => h.trim().toLowerCase());
      const idx = (name) => head.indexOf(name);
      // Hanya empat kolom ini yang dibaca. Kolom lain (jika ada) diabaikan.
      const iK = idx("kelas"), iS = idx("sesi"), iN = idx("skor"), iQ = idx("kutipan");
      rows = data.map((r) => ({
        kelas: (r[iK] || "").trim(), sesi: (r[iS] || "").trim(),
        skor: (r[iN] || "").trim(), kutipan: (r[iQ] || "").trim(),
      })).filter((r) => r.kutipan);
      renderFilters(); render();
    } catch (e) {
      $("list").innerHTML = '<div class="state">Gagal memuat kesan. Coba muat ulang halaman.</div>';
    }
  }
  load();
</script>
</body>
</html>
